<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pankkiiri Twistaa</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0d0c0e;
      color: #e0d8c3;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d8a048;
      text-shadow: 2px 2px 0px #000;
    }

    /* Dive Bar -tausta ja näyttämö */
    .bar-stage {
      position: relative;
      width: 360px;
      height: 380px;
      /* Ränsistynyt pubi-ilme: tunkkainen tausta, kulahtanut tapetti ja tiski */
      background: 
        /* Baaritiski alhaalla */
        linear-gradient(to top, #2b1704 0%, #4a2807 22%, transparent 22%),
        /* Tiskin messinkitanko */
        linear-gradient(to top, transparent 20%, #a37c27 21%, #e5c158 21.5%, #a37c27 22%, transparent 22.5%),
        /* Neon-kyltti taustalla */
        radial-gradient(circle at 80% 20%, rgba(255, 0, 85, 0.15), transparent 40%),
        /* Tunkkainen taustaseinä */
        linear-gradient(to bottom, #1f1a17, #120e0c);
      border: 4px solid #3d2c1e;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 75px;
      overflow: hidden;
    }

    /* Taustarekvisiitta: Dive bar -neon ja pulloja */
    .neon-sign {
      position: absolute;
      top: 15px;
      right: 20px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      color: #ff2a70;
      text-shadow: 0 0 5px #ff2a70, 0 0 10px #ff2a70;
      transform: rotate(-5deg);
      border: 1px solid #ff2a70;
      padding: 3px 6px;
      opacity: 0.7;
    }

    .bottles {
      position: absolute;
      bottom: 84px;
      left: 20px;
      display: flex;
      gap: 6px;
      opacity: 0.5;
    }

    .bottle {
      width: 8px;
      height: 22px;
      background: #1b4d2e;
      border-radius: 2px 2px 0 0;
    }
    .bottle:nth-child(2) { height: 26px; background: #8a2b0e; }
    .bottle:nth-child(3) { height: 18px; background: #a88b13; }

    /* Pankkiiri-hahmo */
    .banker {
      position: relative;
      width: 100px;
      height: 180px;
      transform-origin: bottom center;
      transition: transform 0.1s ease;
    }

    /* Silinterihattu */
    .top-hat {
      position: absolute;
      top: 0;
      left: 25px;
      width: 50px;
      height: 40px;
      background: #111;
      border-radius: 2px 2px 0 0;
      z-index: 4;
    }

    .top-hat::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 70px;
      height: 6px;
      background: #111;
      border-radius: 3px;
    }

    .hat-ribbon {
      position: absolute;
      bottom: 6px;
      width: 100%;
      height: 7px;
      background: #8b0000;
    }

    /* Pää ja kasvot */
    .head {
      position: absolute;
      top: 36px;
      left: 30px;
      width: 40px;
      height: 38px;
      background: #f1c27d;
      border-radius: 50%;
      z-index: 3;
    }

    /* Monokkeli */
    .monocle {
      position: absolute;
      top: 12px;
      right: 6px;
      width: 11px;
      height: 11px;
      border: 2px solid #d4af37;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .monocle-string {
      position: absolute;
      top: 18px;
      right: 3px;
      width: 12px;
      height: 15px;
      border-right: 1px solid #d4af37;
      border-bottom: 1px solid #d4af37;
      border-radius: 0 0 5px 0;
    }

    /* Viikset (mahtavat "Roope-Ankka/porvarilliset" pulisongit/viikset) */
    .mustache {
      position: absolute;
      bottom: 6px;
      left: 5px;
      width: 30px;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
    }

    /* Ilmeetön suu (Kaurismäki-tyyliin) */
    .mouth {
      position: absolute;
      bottom: 4px;
      left: 12px;
      width: 15px;
      height: 2px;
      background: #5a3d28;
    }

    /* Puku ja Vartalo */
    .body {
      position: absolute;
      top: 70px;
      left: 20px;
      width: 60px;
      height: 65px;
      background: #1a2530; /* Vanha tummansininen frakki */
      border-radius: 8px 8px 0 0;
      z-index: 2;
    }

    /* Kauluspaita & Solmio */
    .shirt {
      position: absolute;
      top: 0;
      left: 22px;
      width: 16px;
      height: 35px;
      background: #fff;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .tie {
      position: absolute;
      top: 0;
      left: 28px;
      width: 4px;
      height: 30px;
      background: #a00;
    }

    /* Dollaripussi kädessä */
    .money-bag {
      position: absolute;
      top: 85px;
      right: -5px;
      width: 26px;
      height: 30px;
      background: #c2a649;
      border-radius: 40% 40% 50% 50%;
      border: 1px solid #7a6625;
      font-size: 14px;
      font-weight: bold;
      color: #2b5e2b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }

    /* Jalat ja Kengät */
    .legs {
      position: absolute;
      top: 135px;
      left: 28px;
      width: 44px;
      height: 45px;
      display: flex;
      justify-content: space-between;
    }

    .leg {
      width: 14px;
      height: 100%;
      background: #111;
    }

    .spats { /* Säärystimet kenkien päällä */
      position: absolute;
      bottom: 0;
      width: 16px;
      height: 10px;
      background: #eee;
      border-bottom: 4px solid #000;
      border-radius: 3px 3px 0 0;
    }

    /* AKI KAURISMÄKI TWIST -ANIMAATIO */
    /* Jäykkä, alakuloinen, mutta rytmikäs lanteen pyöritys & polvien hytkyminen */
    .twisting {
      animation: kaurismakiTwist 0.48s infinite alternate ease-in-out;
    }

    .twisting .head {
      animation: rigidHead 0.48s infinite alternate ease-in-out;
    }

    .twisting .money-bag {
      animation: bagJiggle 0.24s infinite alternate ease-in-out;
    }

    @keyframes kaurismakiTwist {
      0% {
        transform: rotate(-12deg) skewX(-8deg) translateY(0px);
      }
      50% {
        transform: rotate(0deg) skewX(0deg) translateY(6px); /* Polvinotkistus */
      }
      100% {
        transform: rotate(12deg) skewX(8deg) translateY(0px);
      }
    }

    @keyframes rigidHead {
      0% { transform: rotate(8deg); }
      100% { transform: rotate(-8deg); }
    }

    @keyframes bagJiggle {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.1) translateY(-4px); }
    }

    /* Painike */
    button {
      margin-top: 25px;
      padding: 16px 32px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: #2b1704;
      background: linear-gradient(to bottom, #e5c158, #a37c27);
      border: 2px solid #d8a048;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h1>Pankkiiri Twistaa</h1>

  <div class="bar-stage">
    <div class="neon-sign">AUKI</div>
    <div class="bottles">
      <div class="bottle"></div>
      <div class="bottle"></div>
      <div class="bottle"></div>
    </div>

    <!-- Hahmo -->
    <div class="banker" id="banker">
      <div class="top-hat">
        <div class="hat-ribbon"></div>
      </div>
      <div class="head">
        <div class="monocle"></div>
        <div class="monocle-string"></div>
        <div class="mustache"></div>
        <div class="mouth"></div>
      </div>
      <div class="body">
        <div class="shirt"></div>
        <div class="tie"></div>
      </div>
      <div class="money-bag">$</div>
      <div class="legs">
        <div class="leg"><div class="spats"></div></div>
        <div class="leg" style="right:0;"><div class="spats"></div></div>
      </div>
    </div>
  </div>

  <button id="twistBtn">Käynnistä Twist!</button>

  <script>
    const banker = document.getElementById('banker');
    const twistBtn = document.getElementById('twistBtn');

    let isTwisting = false;
    let audioCtx = null;
    let timerId = null;

    // SAKSALAISHENKINEN TORVIMUSIIKKI (Web Audio API Syntetisaattori)
    // Ei tarvitse ulkoisia tiedostoja!
    function startBrassOompah() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      let step = 0;
      const bpm = 125;
      const stepTime = (60 / bpm) / 2; // 16-osa tahti

      // Saksalaisen torvimusatyyppiset sävelet (Oompah / Blasmusik)
      const bassNotes = [110, 110, 146.83, 110]; // A1, A1, D2, A1 (Bassotuuba)
      const chordNotes = [
        [220, 277.18, 329.63], // A-duuri
        [220, 277.18, 329.63],
        [220, 293.66, 369.99], // D-duuri
        [207.65, 246.94, 311.13] // E-duuri
      ];

      function playBeat() {
        const now = audioCtx.currentTime;

        // 1. PUMM (Basso / Tuuba iskuille 0, 2, 4...)
        if (step % 2 === 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth'; // Ruosteisen tuuban soundi
          const bassFreq = bassNotes[(step / 2) % bassNotes.length];
          osc.frequency.setValueAtTime(bassFreq, now);

          // Pehmennetään hieman suodatuksella (matala-pää korostuu)
          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(400, now);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.23);
        } 
        // 2. PA-PA (Haitari / Torvisointu väli-iskuille 1, 3, 5...)
        else {
          const chord = chordNotes[Math.floor(step / 2) % chordNotes.length];
          
          chord.forEach(freq => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square'; // Sointu
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.16);
          });
        }

        step++;
      }

      // Pyöritetään musiikkia loopissa
      timerId = setInterval(playBeat, stepTime * 1000);
    }

    function stopBrassOompah() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // Nappiklikkaus
    twistBtn.addEventListener('click', () => {
      isTwisting = !isTwisting;

      if (isTwisting) {
        banker.classList.add('twisting');
        twistBtn.innerText = "Lopeta Twist!";
        twistBtn.style.background = "linear-gradient(to bottom, #c94a4a, #7a2525)";
        twistBtn.style.color = "#fff";
        twistBtn.style.borderColor = "#e55858";
        
        startBrassOompah();
      } else {
        banker.classList.remove('twisting');
        twistBtn.innerText = "Käynnistä Twist!";
        twistBtn.style.background = "linear-gradient(to bottom, #e5c158, #a37c27)";
        twistBtn.style.color = "#2b1704";
        twistBtn.style.borderColor = "#d8a048";

        stopBrassOompah();
      }
    });
  </script>
</body>
</html>
