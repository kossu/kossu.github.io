<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuomitseeko pankkiiri?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: row;
      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 20px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      min-height: 500px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .game-area {
      flex: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: #0f172a;
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 1000px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin.spinning {
      animation: spinCoin 3s infinite linear;
    }

    @keyframes spinCoin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .coin__face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
      border: 8px solid #fef08a;
      background: #facc15;
      color: #422006;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .coin__face--front {
      transform: rotateY(0deg);
    }

    .coin__face--back {
      transform: rotateY(180deg);
    }

    .sidebar {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      border-left: 1px solid #334155;
    }

    .sidebar h1 {
      font-size: 26px;
      margin-bottom: 15px;
      color: #fef08a;
    }

    .sidebar p {
      font-size: 16px;
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #eab308;
      color: #422006;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background-color: #ca8a04;
    }

    .btn:disabled {
      background-color: #64748b;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .result-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .reset-btn {
      background-color: #10b981;
      color: #022c22;
    }

    .reset-btn:hover {
      background-color: #059669;
    }
