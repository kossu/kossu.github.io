<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuomitseeko pankkiiri?</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #eab308;
      --primary-hover: #ca8a04;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: row;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      min-height: 500px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .game-area {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      perspective: 1000px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 800px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin.spinning {
      animation: spinCoin 6s infinite linear;
    }

    @keyframes spinCoin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .coin__face {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.3), inset 0 0 15px rgba(0,0,0,0.4);
      border: 8px solid #fef08a;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      color: #422006;
    }

    .coin__face--front {
      transform: rotateY(0deg);
    }

    .coin__face--back {
      transform: rotateY(180deg);
    }

    .sidebar {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      border-left: 1px solid #334155;
    }

    .sidebar h1 {
      font-size: 26px;
      margin-bottom: 15px;
      color: #fef08a;
    }

    .sidebar p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .btn {
      background-color: var(--primary);
      color: #422006;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(234, 179, 8, 0.4);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 8px -1px rgba(234, 179, 8, 0.5);
    }

    .btn:disabled {
      background-color: #64748b;
      color: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.5s ease forwards;
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .reset-btn {
      background-color: #10b981;
      color: #022c22;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4);
    }
